<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 熙心健康体检系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 414px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .header {
            padding: 20px 15px;
            background: #007aff;
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: #fff;
            margin-right: 15px;
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
        }

        .menu-list {
            background: white;
            margin-top: 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .menu-icon {
            margin-right: 10px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-title {
            flex: 1;
        }

        .menu-arrow {
            color: #999;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 414px;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #eee;
        }

        .nav-item {
            text-align: center;
            color: #666;
            text-decoration: none;
        }

        .active {
            color: #007aff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="user-info">
                <div class="avatar"></div>
                <div class="user-name">张三</div>
            </div>
        </header>

        <div class="menu-list">
            <div class="menu-item">
                <div class="menu-icon">📅</div>
                <div class="menu-title">我的预约</div>
                <div class="menu-arrow">></div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">📋</div>
                <div class="menu-title">体检记录</div>
                <div class="menu-arrow">></div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">⚙️</div>
                <div class="menu-title">设置</div>
                <div class="menu-arrow">></div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">❓</div>
                <div class="menu-title">帮助中心</div>
                <div class="menu-arrow">></div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">📞</div>
                <div class="menu-title">联系我们</div>
                <div class="menu-arrow">></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <div>🏠</div>
                <div>首页</div>
            </a>
            <a href="packages.html" class="nav-item">
                <div>📦</div>
                <div>套餐</div>
            </a>
            <a href="reports.html" class="nav-item">
                <div>📊</div>
                <div>报告</div>
            </a>
            <a href="profile.html" class="nav-item active">
                <div>👤</div>
                <div>我的</div>
            </a>
        </nav>
    </div>
</body>
</html>
